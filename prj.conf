# Console & Logging Configuration
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Zephyr Shell over UART
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="solar-node:~$ "
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=n
CONFIG_SHELL_VT100_COMMANDS=n
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y

# Subsystem Dependencies
CONFIG_GPIO=y

# Stack & Heap Sizes
CONFIG_MAIN_STACK_SIZE=5200

# C++ Support
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y

CONFIG_LED_STRIP=y
CONFIG_I2S=y
CONFIG_WS2812_STRIP_I2S=y

CONFIG_I2C=y

CONFIG_CBPRINTF_FP_SUPPORT=y

# Networking & WiFi 
CONFIG_EARLY_CONSOLE=y
CONFIG_NETWORKING=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Stack Sizes for Networking
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048

# Network Buffers and Contexts
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
CONFIG_NET_MAX_CONTEXTS=10

# IPv4 and DHCP
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y

# TCP/IP Protocols
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y

# WiFi Configuration
CONFIG_WIFI=y
CONFIG_WIFI_LOG_LEVEL_ERR=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_ETHERNET=y

# ESP32 WiFi Station Mode (Auto DHCP)
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y

# Event Queue Management
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16

# DNS Resolver
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_AUTO_INIT=y

# MQTT Configuration (Phase 3)
CONFIG_MQTT_LIB=y

# Power Management (Phase 4) - Disabled for now due to linking issues
# CONFIG_PM=y
# CONFIG_PM_DEVICE=y

# ADC Configuration (Phase 2)
CONFIG_ADC=y
CONFIG_SENSOR=y